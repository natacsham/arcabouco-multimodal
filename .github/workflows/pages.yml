name: Verificar e publicar Arcabouço Multimodal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_traceability_rdf.py --check
      - run: python -B scripts/source_catalog.py --check --check-projection web/assets/source-catalog.json
      - run: python scripts/verify_public.py
      - run: python -B experimental/v2/verify_trajectory.py --output experimental/v2/evidence/trajectory-report.json
      - run: python -B experimental/v2/verify.py
      - run: python scripts/check_bundle.py
      - run: node tests/intake.mjs
      - run: node tests/result-presentation.mjs
      - run: node tests/source-path.mjs
      - run: python -B tests/publish-gates.py
      - run: python scripts/audit_distribution.py
      - run: python scripts/publish_traceability.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
