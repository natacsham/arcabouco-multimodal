name: Verificar e publicar Arcabouço Multimodal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_traceability_rdf.py --check
      - run: python -B scripts/source_catalog.py --check --check-projection web/assets/source-catalog.json
      - run: python scripts/verify_public.py --jobs 4 --report evidence/technical-1.6-report.json --reasoner-report evidence/reasoner-1.6-report.json
      - name: Show verification failure details
        if: failure()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('evidence/technical-1.6-report.json')
          if path.exists():
              report = json.loads(path.read_text(encoding='utf-8'))
              for name, check in report.get('checks', {}).items():
                  if not check.get('passed'):
                      details = {key: value for key, value in check.items()
                                 if key not in {'output', 'findings'}}
                      for group in ('failures', 'errors'):
                          for item in details.get(group, []):
                              trace = item.get('traceback', '')
                              if len(trace) > 6000:
                                  item['traceback'] = trace[:4500] + '\n... truncated ...\n' + trace[-1000:]
                      print(name, json.dumps(details, ensure_ascii=False, indent=2))
          PY
      - run: python -B experimental/v2/verify_trajectory.py --output experimental/v2/evidence/trajectory-report.json
      - run: python -B experimental/v2/verify.py
      - run: python -B experimental/v2/verify_situated.py --output experimental/v2/evidence/situated-report.json
      - run: python -B scripts/check_narrative_to_actions.py --output evidence/narrative-to-actions-report.json
      - run: python scripts/check_bundle.py
      - run: node tests/intake.mjs
      - run: node tests/review-input.mjs
      - run: node tests/progress.mjs
      - run: node tests/result-presentation.mjs
      - run: node tests/situated-output.mjs
      - run: node tests/source-path.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      # verify_public above runs every tests/test_*.py file, including
      # articulation, remote and semantic regressions, in isolated processes.
      - run: node tests/remote-browser.mjs
      - run: node tests/situated-browser.mjs
      - run: node tests/articulation-browser.mjs
        env:
          AMADO_BROWSER_EVIDENCE: evidence/articulation-browser.json
      - run: python -B tests/publish-gates.py
      - run: python scripts/audit_distribution.py
      - run: python scripts/publish_traceability.py
      - run: python scripts/check_bundle.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
